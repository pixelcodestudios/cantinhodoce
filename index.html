<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Cantinho Doce · Gestão</title>

  <!-- Tailwind CSS (via CDN, compila as classes diretamente no browser) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Mapa de módulos: resolve "react", "lucide-react", "recharts" a partir de um CDN,
       sem precisar de npm install nem de passo de build. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone: transforma o JSX do CantinhoDoce.jsx em JavaScript, no próprio browser -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; background: #FBF7F5; }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8A6B72;font-family:sans-serif;font-size:14px;">
      A carregar o Cantinho Doce…
    </div>
  </div>

  <!-- O ficheiro da aplicação (JSX) -->
  <script type="text/babel" data-presets="react" data-type="module" src="./CantinhoDoce.jsx"></script>

  <!-- Ponto de entrada: importa o componente e monta-o no ecrã -->
  <script type="text/babel" data-presets="react" data-type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import CantinhoDoce from "./CantinhoDoce.jsx";

    createRoot(document.getElementById("root")).render(<CantinhoDoce />);
  </script>
</body>
</html>
